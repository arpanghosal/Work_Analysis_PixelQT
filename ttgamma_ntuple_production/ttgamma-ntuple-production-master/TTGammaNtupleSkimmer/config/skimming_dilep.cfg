# These are the options used for skimming ntuples for the dilepton SR
cuts = @ph_good_index->size() == 1
slim-branch = *_up
slim-branch = *_UP
slim-branch = *_down
slim-branch = *_DOWN
slim-branch = el_true*
slim-branch = mu_true*
slim-branch = HLT*
slim-branch = hasBadMuon
slim-branch = ph_ss*
slim-branch = jet_mv2c10*
slim-branch = el_CF
